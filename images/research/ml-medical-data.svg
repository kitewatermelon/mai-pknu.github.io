<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Roboto Slab, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#e3eef8"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d5fa8"/><stop offset="1" stop-color="#0f3d73"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#19a7ce"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- 입력 데이터: EHR / Genomics / Bio-signal -->
  <g>
    <rect x="50" y="50" width="170" height="90" rx="12" fill="#fff" stroke="#d5deea"/>
    <rect x="68" y="68" width="34" height="44" rx="4" fill="#e7f6fb" stroke="#19a7ce" stroke-width="2"/>
    <path d="M75 80h20M75 89h20M75 98h14" stroke="#19a7ce" stroke-width="2.5" stroke-linecap="round"/>
    <text x="114" y="88" font-size="16" font-weight="700" fill="#0b1a2c">EHR</text>
    <text x="114" y="108" font-size="12" fill="#6b7684">Clinical records</text>

    <rect x="50" y="180" width="170" height="90" rx="12" fill="#fff" stroke="#d5deea"/>
    <path d="M72 198c20 14 20 40 0 54M98 198c-20 14-20 40 0 54" fill="none" stroke="#1d5fa8" stroke-width="3"/>
    <path d="M76 209h18M74 225h22M76 241h18" stroke="#19a7ce" stroke-width="2.5"/>
    <text x="114" y="218" font-size="16" font-weight="700" fill="#0b1a2c">Genomics</text>
    <text x="114" y="238" font-size="12" fill="#6b7684">SNP / gene data</text>

    <rect x="50" y="310" width="170" height="90" rx="12" fill="#fff" stroke="#d5deea"/>
    <path d="M64 356h10l6-18 9 34 8-26 6 10h9" fill="none" stroke="#e0566b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="114" y="348" font-size="16" font-weight="700" fill="#0b1a2c">Bio-signal</text>
    <text x="114" y="368" font-size="12" fill="#6b7684">CTG / vital signs</text>
  </g>

  <!-- 화살표 -->
  <path d="M228 95C280 95 280 200 318 214" fill="none" stroke="#19a7ce" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ar)"/>
  <path d="M228 225H316" fill="none" stroke="#19a7ce" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ar)"/>
  <path d="M228 355C280 355 280 250 318 236" fill="none" stroke="#19a7ce" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ar)"/>

  <!-- 신경망 -->
  <rect x="328" y="110" width="220" height="230" rx="18" fill="url(#core)"/>
  <g stroke="#8fd3ea" stroke-opacity=".55" stroke-width="1.5">
    <path d="M370 160 438 145M370 160 438 195M370 160 438 245M370 160 438 295M370 225 438 145M370 225 438 195M370 225 438 245M370 225 438 295M370 290 438 145M370 290 438 195M370 290 438 245M370 290 438 295"/>
    <path d="M438 145 506 190M438 195 506 190M438 245 506 190M438 295 506 190M438 145 506 260M438 195 506 260M438 245 506 260M438 295 506 260"/>
  </g>
  <g fill="#fff">
    <circle cx="370" cy="160" r="10"/><circle cx="370" cy="225" r="10"/><circle cx="370" cy="290" r="10"/>
  </g>
  <g fill="#19a7ce" stroke="#fff" stroke-width="2">
    <circle cx="438" cy="145" r="9"/><circle cx="438" cy="195" r="9"/><circle cx="438" cy="245" r="9"/><circle cx="438" cy="295" r="9"/>
  </g>
  <g fill="#ffd166"><circle cx="506" cy="190" r="10"/><circle cx="506" cy="260" r="10"/></g>
  <text x="438" y="328" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1.5">DATA INTEGRATION</text>

  <path d="M556 225H606" fill="none" stroke="#19a7ce" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 결과 -->
  <rect x="614" y="120" width="146" height="210" rx="14" fill="#fff" stroke="#d5deea"/>
  <text x="687" y="152" font-size="14" font-weight="700" fill="#0b1a2c" text-anchor="middle">Prediction</text>
  <g font-size="11" fill="#6b7684">
    <text x="632" y="182">Diagnosis</text>
    <rect x="632" y="188" width="110" height="10" rx="5" fill="#eef2f7"/><rect x="632" y="188" width="92" height="10" rx="5" fill="#1d5fa8"/>
    <text x="632" y="222">Risk score</text>
    <rect x="632" y="228" width="110" height="10" rx="5" fill="#eef2f7"/><rect x="632" y="228" width="64" height="10" rx="5" fill="#19a7ce"/>
    <text x="632" y="262">Missing data</text>
    <rect x="632" y="268" width="110" height="10" rx="5" fill="#eef2f7"/>
    <rect x="632" y="268" width="38" height="10" rx="5" fill="#0f3d73"/>
    <rect x="672" y="268" width="36" height="10" rx="5" fill="#19a7ce" fill-opacity=".45" stroke="#19a7ce" stroke-dasharray="3 2"/>
    <text x="632" y="306" font-size="10.5" fill="#19a7ce" font-weight="700">IMPUTED</text>
  </g>
</svg>
