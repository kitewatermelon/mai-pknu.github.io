  <path d="M230 200H272" fill="none" stroke="#19a7ce" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ar)"/>

  <!-- 모델 -->
  <rect x="282" y="130" width="150" height="140" rx="16" fill="url(#box)"/>
  <g stroke="#8fd3ea" stroke-opacity=".6" stroke-width="1.5">
    <path d="M315 170 357 160M315 170 357 200M315 170 357 240M315 230 357 160M315 230 357 200M315 230 357 240M357 160 399 200M357 200 399 200M357 240 399 200"/>
  </g>
