<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Roboto Slab, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#e3eef8"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d5fa8"/><stop offset="1" stop-color="#0f3d73"/>
    </linearGradient>
    <radialGradient id="heat" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ffb02e" stop-opacity=".75"/>
      <stop offset=".8" stop-color="#ffe066" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb02e" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
