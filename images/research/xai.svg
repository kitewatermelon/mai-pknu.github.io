  <g fill="none" stroke="#c7d0db" stroke-width="3" stroke-linecap="round" opacity=".85">
    <path d="M130 110v170"/>
    <path d="M122 140c-30 0-56 6-62 18M122 166c-32 0-58 8-64 20M122 192c-32 0-58 8-62 22M122 218c-30 0-52 8-56 22"/>
