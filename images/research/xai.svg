    <rect x="648" y="229" width="94" height="8" rx="4" fill="#eef2f7"/><rect x="648" y="229" width="18" height="8" rx="4" fill="#1d5fa8"/>
  </g>

  <rect x="512" y="278" width="230" height="74" rx="10" fill="#e7f6fb"/>
  <text x="528" y="304" font-size="12" font-weight="700" fill="#0b7da0">Interpretable decision</text>
