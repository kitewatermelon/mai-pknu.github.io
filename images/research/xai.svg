  <g fill="#19a7ce"><circle cx="357" cy="160" r="7"/><circle cx="357" cy="200" r="7"/><circle cx="357" cy="240" r="7"/></g>
  <circle cx="399" cy="200" r="8" fill="#ffd166"/>
  <text x="357" y="292" font-size="14" font-weight="700" fill="#0b1a2c" text-anchor="middle">AI Model</text>

  <path d="M442 200H484" fill="none" stroke="#19a7ce" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ar)"/>

  <!-- 설명: 히트맵 + 근거 -->
  <rect x="494" y="70" width="266" height="300" rx="14" fill="#fff" stroke="#d5deea"/>
  <rect x="512" y="88" width="120" height="146" rx="10" fill="#0b1a2c"/>
